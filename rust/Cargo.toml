[package]
name = "vscode_runner"
version = "2.0.0"
edition = "2021"
description = "KRunner plugin for quickly opening recent VSCode workspaces"
license = "MIT"

[dependencies]
krunner = { version = "0.1.1", features = ["derive"] }
rusqlite = { version = "0.31", features = ["bundled"] }
dirs = "5"
log = "0.4"
env_logger = "0.11"
regex = "1"
serde_json = "1"
notify = "6"

[dev-dependencies]
tempfile = "3"
